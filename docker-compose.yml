version: '3.8'

services:

  # ── OpenSearch ────────────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ged-opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ged-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── SQL Server ────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ged-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=GedPass_2024!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GedPass_2024!' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── SQL Server init ───────────────────────────────────────────────────────────
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ged-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - ged-network
    volumes:
      - ./backend/init_schema.sql:/tmp/init_schema.sql:ro
    environment:
      - SA_PASSWORD=GedPass_2024!
    command: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'GedPass_2024!' -No -C -Q \"IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'ged_db') CREATE DATABASE ged_db\" && /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'GedPass_2024!' -No -C -d ged_db -i /tmp/init_schema.sql && echo 'Schema ready.'"]
    restart: "no"

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ged-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Apache Tika ───────────────────────────────────────────────────────────────
  tika:
    image: apache/tika:latest-full
    container_name: ged-tika
    ports:
      - "9998:9998"
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9998/tika || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Ollama (LLM server) ───────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ged-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Ollama model pull ─────────────────────────────────────────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ged-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ged-network
    environment:
      - OLLAMA_HOST=ollama:11434
    command: ["/bin/sh", "-c", "ollama pull llama3.2 && ollama pull nomic-embed-text && echo 'Models ready.'"]
    restart: "no"

  # ── Backend (ASP.NET Core API) ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: ged-backend
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ged_db;User Id=sa;Password=GedPass_2024!;TrustServerCertificate=True;
      - OpenSearch__Url=http://opensearch:9200
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
      - Redis__Enabled=true
      - Redis__ConnectionString=redis:6379
      - Redis__SearchCacheTtlSeconds=120
      - NLP__Enabled=true
      - NLP__LlmApiEndpoint=http://ollama:11434/api/generate
      - NLP__EmbedApiEndpoint=http://ollama:11434/api/embed
      - NLP__Model=llama3.2
      - NLP__EmbedModel=nomic-embed-text
      - Embeddings__Enabled=true
      - Embeddings__Model=nomic-embed-text
      - Embeddings__Dimensions=768
      - Tika__Enabled=true
      - Tika__Url=http://tika:9998
      - OCR__TessDataPath=/usr/share/tesseract-ocr/5/tessdata
      - OCR__OcrmypdfPath=ocrmypdf
      - OCR__TesseractPath=tesseract
      - Reindex__Enabled=true
      - Reindex__BatchSize=50
      - Reindex__StaleCheckIntervalMinutes=5
      - Reindex__MissingCheckIntervalMinutes=15
      - Reindex__FailedRetryIntervalMinutes=30
      - RAG__TopK=5
      - RAG__MaxContextChars=6000
      - Auth__UsersFilePath=/var/lib/ged/users.json
      - Document__MaxUploadSizeMB=100
    depends_on:
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      tika:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - ged-network
    volumes:
      - ged-documents:/var/lib/ged/documents
      - ged-users:/var/lib/ged
      - ./backend/logs:/app/logs
    restart: unless-stopped

  # ── Frontend (Vue + nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: ged-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  opensearch-data:
    driver: local
  rabbitmq-data:
    driver: local
  sqlserver-data:
    driver: local
  ged-documents:
    driver: local
  ged-users:
    driver: local
  ollama-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  ged-network:
    driver: bridge