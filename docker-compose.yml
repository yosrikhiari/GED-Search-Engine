version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ged-opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ged-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ged-postgres
    environment:
      - POSTGRES_USER=ged_user
      - POSTGRES_PASSWORD=ged_pass
      - POSTGRES_DB=ged_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ged_user -d ged_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: ged-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Apache Tika Server ────────────────────────────────────────────────────────
  # Primary text extraction engine. Supports 1000+ formats.
  # Satisfies: "Apache Tika pour l'extraction et la normalisation du texte"
  tika:
    image: apache/tika:latest-full
    container_name: ged-tika
    ports:
      - "9998:9998"
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9998/tika || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ged-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ged-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ged-network
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      /bin/sh -c "
        echo '⏳ Pulling llama3.2...' &&
        ollama pull llama3.2 &&
        echo '⏳ Pulling nomic-embed-text...' &&
        ollama pull nomic-embed-text &&
        echo '✅ All models ready!'
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: ged-backend
    ports:
      - "5001:8080"
    environment:
      - OCR__TessDataPath=/usr/share/tesseract-ocr/5/tessdata
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - OpenSearch__Url=http://opensearch:9200
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=admin123
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=ged_db;Username=ged_user;Password=ged_pass;Port=5432
      - NLP__Enabled=true
      - NLP__LlmApiEndpoint=http://ollama:11434/api/generate
      - NLP__Model=llama3.2
      # Apache Tika
      - Tika__Enabled=true
      - Tika__Url=http://tika:9998
      # Redis
      - Redis__Enabled=true
      - Redis__ConnectionString=redis:6379
      - Redis__SearchCacheTtlSeconds=120
      # Embeddings
      - Embeddings__Enabled=false
      - Embeddings__Model=nomic-embed-text
      - Embeddings__Dimensions=768
      # Auto-reindex
      - Reindex__Enabled=true
      - Reindex__BatchSize=50
      - Reindex__StaleCheckIntervalMinutes=5
      - Reindex__MissingCheckIntervalMinutes=15
      - Reindex__FailedRetryIntervalMinutes=30
      # RAG
      - RAG__TopK=5
      - RAG__MaxContextChars=6000
      # Auth / JWT
      - Auth__JwtSecret=GED-SuperSecretKey-ChangeInProduction-2024!
      - Auth__JwtIssuer=GED-SearchEngine
      - Auth__JwtExpiryHours=8
      - Auth__UsersFilePath=/var/lib/ged/users.json
    depends_on:
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tika:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - ged-network
    volumes:
      - ged-documents:/var/lib/ged/documents
      - ged-users:/var/lib/ged
      - ./backend/logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: ged-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5001
    depends_on:
      - backend
    networks:
      - ged-network
    restart: unless-stopped

volumes:
  opensearch-data:
    driver: local
  rabbitmq-data:
    driver: local
  postgres-data:
    driver: local
  ged-documents:
    driver: local
  ged-users:
    driver: local
  ollama-data:
    driver: local

networks:
  ged-network:
    driver: bridge
