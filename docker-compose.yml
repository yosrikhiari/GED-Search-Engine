version: '3.8'

services:

  # ── OpenSearch ────────────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ged-opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
      # Security: required by OpenSearch 2.12+ but we'll disable SSL and use no auth for local dev
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=GedOpensearch2024!
      - plugins.security.disabled=true
      - plugins.security.ssl.http.enabled=false
      - plugins.security.allow_default_init_securityindex=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ged-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin123}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  # ── SQL Server ────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ged-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD:-GedPass_2024!}
      - MSSQL_PID=Express
      - MSSQL_IP_ADDRESS=0.0.0.0
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD:-GedPass_2024!}' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0

  # ── SQL Server init ─────────────────────────────────────────────────────────--
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ged-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - ged-network
    volumes:
      - ./backend/init_schema.sql:/tmp/init_schema.sql:ro
    environment:
      - SA_PASSWORD=${DB_PASSWORD:-GedPass_2024!}
    command: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P '${DB_PASSWORD:-GedPass_2024!}' -No -C -Q \"IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'ged_db') CREATE DATABASE ged_db\" && /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P '${DB_PASSWORD:-GedPass_2024!}' -No -C -d ged_db -i /tmp/init_schema.sql && echo 'Schema ready.'"]
    restart: "no"

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ged-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Apache Tika ───────────────────────────────────────────────────────────────
  tika:
    image: apache/tika:latest-full
    container_name: ged-tika
    ports:
      - "9998:9998"
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9998/tika || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Ollama (LLM server) ───────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ged-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Ollama model pull ─────────────────────────────────────────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ged-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ged-network
    environment:
      - OLLAMA_HOST=ollama:11434
    command: ["sh", "-c", "ollama pull llama3.2:1b && ollama pull nomic-embed-text && echo 'Models ready.'"]
    restart: "no"

  # ── Backend (ASP.NET Core API) ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ged-backend
    ports:
      - "${BACKEND_PORT:-5001}:8080"
    environment:
      # Application
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      # Database
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER:-sqlserver};Database=${DB_NAME:-ged_db};User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-GedPass_2024!};TrustServerCertificate=${DB_TRUST_CERTIFICATE:-True}
      # OpenSearch
      - OpenSearch__Url=http://${OPENSEARCH_HOST:-opensearch}:${OPENSEARCH_PORT:-9200}
      - OpenSearch__Username=${OPENSEARCH_USER:-admin}
      - OpenSearch__Password=${OPENSEARCH_PASSWORD:-GedOpensearch2024!}
      - OpenSearch__SecurityEnabled=${OPENSEARCH_SECURITY_ENABLED:-false}
      # RabbitMQ
      - RabbitMQ__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMQ__Port=${RABBITMQ_PORT:-5672}
      - RabbitMQ__Username=${RABBITMQ_USER:-admin}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-admin123}
      # Redis
      - Redis__Enabled=${REDIS_ENABLED:-true}
      - Redis__ConnectionString=${REDIS_HOST:-redis}:${REDIS_PORT:-6379}${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}
      - Redis__SearchCacheTtlSeconds=${CACHE_SEARCH_TTL_SECONDS:-120}
      # NLP / LLM
      - NLP__Enabled=${NLP_ENABLED:-true}
      - NLP__LlmApiEndpoint=${NLP_LLM_API_ENDPOINT:-http://ollama:11434/api/generate}
      - NLP__EmbedApiEndpoint=${NLP_EMBED_API_ENDPOINT:-http://ollama:11434/api/embed}
      - NLP__Model=${NLP_MODEL:-llama3.2:1b}
      - NLP__EmbedModel=${NLP_EMBED_MODEL:-nomic-embed-text}
      # Embeddings
      - Embeddings__Enabled=true
      - Embeddings__Model=${NLP_EMBED_MODEL:-nomic-embed-text}
      - Embeddings__Dimensions=768
      # Tika
      - Tika__Enabled=${TIKA_ENABLED:-true}
      - Tika__Url=${TIKA_URL:-http://tika:9998}
      # OCR
      - OCR__TessDataPath=${OCR_TESSDATA_PATH:-/usr/share/tesseract-ocr/5/tessdata}
      - OCR__OcrmypdfPath=${OCR_OCRMYPDF_PATH:-ocrmypdf}
      - OCR__TesseractPath=${OCR_TESSERACT_PATH:-tesseract}
      # Reindex
      - Reindex__Enabled=${REINDEX_ENABLED:-true}
      - Reindex__BatchSize=${REINDEX_BATCH_SIZE:-50}
      - Reindex__StaleCheckIntervalMinutes=${REINDEX_STALE_CHECK_INTERVAL_MINUTES:-5}
      - Reindex__MissingCheckIntervalMinutes=${REINDEX_MISSING_CHECK_INTERVAL_MINUTES:-15}
      - Reindex__FailedRetryIntervalMinutes=${REINDEX_FAILED_RETRY_INTERVAL_MINUTES:-30}
      # RAG
      - RAG__TopK=${RAG_TOP_K:-5}
      - RAG__MaxContextChars=${RAG_MAX_CONTEXT_CHARS:-6000}
      # Auth
      - Auth__UsersFilePath=${AUTH_USERS_FILE_PATH:-/var/lib/ged/users.json}
      - Auth__SessionDurationHours=${AUTH_SESSION_DURATION_HOURS:-8}
      # Document
      - Document__MaxUploadSizeMB=${DOCUMENT_MAX_UPLOAD_SIZE_MB:-100}
    depends_on:
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      tika:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - ged-network
    volumes:
      - ged-documents:/var/lib/ged/documents
      - ged-users:/var/lib/ged
      - backend-logs:/app/logs
    restart: unless-stopped
    mem_limit: 1.5g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend (Vue + nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: ged-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  opensearch-data:
    driver: local
  rabbitmq-data:
    driver: local
  sqlserver-data:
    driver: local
  ged-documents:
    driver: local
  ged-users:
    driver: local
  ollama-data:
    driver: local
  backend-logs:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  ged-network:
    driver: bridge